[project]
name = "nse-edge"
version = "0.1.0"
description = "Evidence-first NSE intraday research (research only, no order placement)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyyaml>=6.0", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
